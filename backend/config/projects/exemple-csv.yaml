version: 1
projectName: "Collecte Terrain CSV / Excel — Madagascar"
requiredFields:
  - field: fullName
    severity: bloquante
    label: "Nom complet du bénéficiaire"
  - field: zone
    severity: a_verifier
    label: "Zone d'intervention déclarée"
  - field: phone
    severity: mineure
    label: "Téléphone de contact"
ranges:
  age:
    min: 0
    max: 110
    severity: bloquante
  amount:
    min: 0
    max: 25000
    severity: a_verifier
  recordedAt:
    minYear: 2018
    allowFutureDays: 1
    severity: a_verifier
geoBounds:
  enabled: true
  zoneName: "Madagascar"
  minLat: -25.0
  maxLat: -11.0
  minLon: 43.0
  maxLon: 51.0
  rejectZeroZero: true
  severity: bloquante
  mismatchSeverity: a_verifier
  interventionZones:
    - name: "Antananarivo"
      minLat: -19.05
      maxLat: -18.70
      minLon: 47.35
      maxLon: 47.70
    - name: "Antsirabe"
      minLat: -20.05
      maxLat: -19.70
      minLon: 46.85
      maxLon: 47.20
    - name: "Toamasina"
      minLat: -18.35
      maxLat: -17.95
      minLon: 49.20
      maxLon: 49.60
    - name: "Mahajanga"
      minLat: -15.90
      maxLat: -15.50
      minLon: 46.10
      maxLon: 46.50
    - name: "Toliara"
      minLat: -23.55
      maxLat: -23.15
      minLon: 43.45
      maxLon: 43.90
duplicateDetection:
  exactBusinessKeyFields:
    - fullName
    - phone
  exactSeverity: bloquante
  nearDuplicate:
    enabled: true
    autoMergeThreshold: 0.95
    reviewThreshold: 0.80
    severity: a_verifier
guardrails:
  maxAbnormalAnomalyRatio: 0.45
  maxActionsPerRun: 60
  maxTokensPerRun: 16000
  minAgentConfidence: 0.65
enumeratorQuality:
  enabled: true
  minRepeatedSubmissions: 3
  severity: bloquante
