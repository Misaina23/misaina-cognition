version: 1
projectName: "Collecte Terrain CSV / Excel — Sénégal"
requiredFields:
  - field: fullName
    severity: bloquante
    label: "Nom complet du bénéficiaire"
  - field: zone
    severity: a_verifier
    label: "Zone d'intervention déclarée"
  - field: phone
    severity: mineure
    label: "Téléphone de contact"
ranges:
  age:
    min: 0
    max: 110
    severity: bloquante
  amount:
    min: 0
    max: 25000
    severity: a_verifier
  recordedAt:
    minYear: 2018
    allowFutureDays: 1
    severity: a_verifier
geoBounds:
  enabled: true
  zoneName: "Bassin Sahel & Afrique de l'Ouest"
  minLat: 4.0
  maxLat: 27.5
  minLon: -18.0
  maxLon: 16.5
  rejectZeroZero: true
  severity: bloquante
  mismatchSeverity: a_verifier
  interventionZones:
    - name: "Dakar"
      minLat: 14.55
      maxLat: 14.88
      minLon: -17.55
      maxLon: -17.15
    - name: "Thiès"
      minLat: 14.60
      maxLat: 15.05
      minLon: -17.15
      maxLon: -16.65
    - name: "Kaolack"
      minLat: 13.95
      maxLat: 14.35
      minLon: -16.30
      maxLon: -15.85
    - name: "Saint-Louis"
      minLat: 15.80
      maxLat: 16.25
      minLon: -16.65
      maxLon: -16.25
    - name: "Ziguinchor"
      minLat: 12.40
      maxLat: 12.75
      minLon: -16.45
      maxLon: -16.05
duplicateDetection:
  exactBusinessKeyFields:
    - fullName
    - phone
  exactSeverity: bloquante
  nearDuplicate:
    enabled: true
    autoMergeThreshold: 0.95
    reviewThreshold: 0.80
    severity: a_verifier
guardrails:
  maxAbnormalAnomalyRatio: 0.45
  maxActionsPerRun: 60
  maxTokensPerRun: 16000
  minAgentConfidence: 0.65
