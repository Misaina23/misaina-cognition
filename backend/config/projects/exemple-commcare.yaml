version: 1
projectName: "Suivi Santé Communautaire CommCare"
requiredFields:
  - field: fullName
    severity: bloquante
    label: "Nom du patient / ménage"
  - field: zone
    severity: bloquante
    label: "District sanitaire d'intervention"
  - field: phone
    severity: a_verifier
    label: "Numéro de suivi"
ranges:
  age:
    min: 0
    max: 105
    severity: bloquante
  amount:
    min: 0
    max: 15000
    severity: a_verifier
  recordedAt:
    minYear: 2020
    allowFutureDays: 0
    severity: a_verifier
geoBounds:
  enabled: true
  zoneName: "Madagascar"
  minLat: -25.0
  maxLat: -11.0
  minLon: 43.0
  maxLon: 51.0
  rejectZeroZero: true
  severity: bloquante
  mismatchSeverity: a_verifier
  interventionZones:
    - name: "Antananarivo"
      minLat: -19.05
      maxLat: -18.70
      minLon: 47.35
      maxLon: 47.70
    - name: "Antsirabe"
      minLat: -20.05
      maxLat: -19.70
      minLon: 46.85
      maxLon: 47.20
duplicateDetection:
  exactBusinessKeyFields:
    - fullName
    - phone
  exactSeverity: bloquante
  nearDuplicate:
    enabled: true
    autoMergeThreshold: 0.94
    reviewThreshold: 0.80
    severity: a_verifier
guardrails:
  maxAbnormalAnomalyRatio: 0.40
  maxActionsPerRun: 50
  maxTokensPerRun: 16000
  minAgentConfidence: 0.70
